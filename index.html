<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- El sitio es solo oscuro: se le avisa al navegador antes de que cargue el CSS -->
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0E0E10" />
    <meta name="description" content="Auraware: componentes y periféricos para tu PC, con precios en pesos argentinos." />
    <title>Auraware</title>
    <!-- Poppins para el texto y JetBrains Mono para precios, botones y etiquetas -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- T-028: las fuentes no frenan el primer dibujo: se muestra la del sistema y se cambia al llegar -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Poppins:wght@400;500;600&display=swap"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Poppins:wght@400;500;600&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <!-- T-028: el catálogo se pide acá, mientras baja el JS, en vez de después.
         Lo retoma src/data/catalogo.js. La clave es la pública (la misma que usa la web). -->
    <link rel="preconnect" href="https://jsgnjdtqktfxgfwuixfv.supabase.co" crossorigin />
    <script>
      window.__catalogo = fetch(
        'https://jsgnjdtqktfxgfwuixfv.supabase.co/rest/v1/productos?select=*&order=id.asc&apikey=sb_publishable_ERypV6QKT8oNZZcxm-2FXQ_80ZWexRE',
      ).then(function (r) {
        if (!r.ok) throw new Error('Supabase respondió ' + r.status)
        return r.json()
      })
      window.__catalogo.catch(function () {})
    </script>
  </head>
  <body>
    <!-- Se ve mientras llegan los productos de la base de datos; React lo reemplaza al cargar -->
    <div id="root">
      <p style="margin: 40vh 0 0; text-align: center; color: #9B9BA6; font-family: system-ui, sans-serif">
        Cargando el catálogo…
      </p>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
